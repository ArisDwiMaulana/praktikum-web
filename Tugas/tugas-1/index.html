<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-secondary">
    <div class="w-50 container bg-light mt-5 p-4 rounded-3">
      <h1 class="text-center pb-3">Login</h1>
      <form action="home_page.html" method="get">
        <div class="mb-3">
          <label for="Username" class="form-label">Username</label>
          <input type="text" class="form-control" id="Username" required />
        </div>
        <div class="mb-3">
          <label for="Password" class="form-label">Password</label>
          <input type="password" class="form-control" id="Password" required />
        </div>
        <div class="mb-3">
          <label for="Email" class="form-label">Email</label>
          <input type="email" class="form-control" id="Email" required />
        </div>
        <div class="mb-3">
          <label for="Age" class="form-label">Age</label>
          <input type="number" class="form-control" id="Age" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="Date">Date of Birth</label>
          <input type="date" class="form-control" id="Date" required />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="Remember" />
          <label class="form-check-label" for="Remember">Remember me</label>
        </div>
        <span>Gender</span>
        <div class="d-flex justify-content-between pb-3" style="width: 18%">
          <div class="form-check">
            <input class="form-check-input" type="radio" id="radio1" required />
            <label class="form-check-label" for="radio1"> Male </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="radio2" required />
            <label class="form-check-label" for="radio2"> Female </label>
          </div>
        </div>
        <div class="d-grid gap-2">
          <button class="btn btn-primary" type="submit">Login</button>
        </div>
      </form>
    </div>
  </body>
</html>
